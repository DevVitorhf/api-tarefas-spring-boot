spring:
  datasource:
    url: jdbc:h2:mem:produtos
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  h2:
    console:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
